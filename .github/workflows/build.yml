name: Build LeviMusic Android ARM64
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - name: Install NDK and build tools
        run: |
          sdkmanager --install "ndk;28.2.13676358" "platforms;android-28"
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake
      - name: Configure ARM64 Android
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Compile and package .levipack
        run: cmake --build build --target levipack --parallel 2
      - name: Verify package
        run: unzip -l build/LeviMusic-0.1.0-arm64-v8a.levipack
      - uses: actions/upload-artifact@v4
        with:
          name: LeviMusic-Android-levipack
          path: build/LeviMusic-0.1.0-arm64-v8a.levipack
          if-no-files-found: error
