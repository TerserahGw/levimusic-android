name: Build & Release LeviMusic Android ARM64

on:
  push:
    branches: [main, 'work/levimusic-1.6.6']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: levimusic-release-main
  cancel-in-progress: false

jobs:
  sync-english-notes:
    if: contains(github.event.head_commit.message, '[sync-english-notes]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout English release notes
        uses: actions/checkout@v4
      - name: Update the existing v1.5.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.5.0 --notes-file release-notes/v1.5.0.md

  build-and-release:
    if: ${{ !contains(github.event.head_commit.message, '[sync-english-notes]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code and version tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          channel="$(tr -d '\r\n ' < RELEASE_CHANNEL)"
          [[ "$channel" == stable || "$channel" == beta ]] || { echo "Invalid release channel"; exit 1; }
          existing="$(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta)?$' | sort -V | tail -n 1 || true)"
          previous="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ "$channel" == stable && "$(cat VERSION)" == 1.6.0 ]]; then
            # Rebuild the requested v1.6.0 tag after its first published assets.
            version=1.6.0
            already_released=true
          elif [[ -n "$existing" ]]; then
            version="${existing#v}"
            version="${version%-beta}"
            already_released=true
          else
            minimum="$(tr -d '\r\n ' < VERSION)"
            [[ "$minimum" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $minimum"; exit 1; }
            if [[ -z "$previous" ]]; then
              version="$minimum"
            else
              IFS=. read -r major minor patch <<< "${previous#v}"
              candidate="$major.$minor.$((patch + 1))"
              version="$(printf '%s\n%s\n' "$minimum" "$candidate" | sort -V | tail -n 1)"
            fi
            already_released=false
          fi
          {
            echo "version=$version"
            if [[ "$channel" == stable ]]; then echo "tag=v$version"
            else echo "tag=v$version-beta"; fi
            echo "channel=$channel"
            echo "previous_tag=$previous"
            echo "already_released=$already_released"
          } >> "$GITHUB_OUTPUT"
          echo "Version: v$version; previous: ${previous:-none}; already released: $already_released"

      - name: Verify world renderer behavior on host
        run: |
          g++ -std=c++20 -D_GNU_SOURCE -Wall -Wextra -Werror \
            -Itests/stubs tests/world_lyrics_smoke.cpp -o /tmp/levimusic-world-smoke
          /tmp/levimusic-world-smoke

      - name: Set Android versionCode and versionName
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          IFS='.' read -r major minor patch <<< "$VERSION"
          code=$((major*10000 + minor*100 + patch))
          # Match the briefly published 1.6.1 APK so an in-place reinstall is allowed.
          if [[ "$VERSION" == 1.6.0 ]]; then code=10601; fi
          if [[ "$major" == 1 && "$minor" == 6 && "$patch" -ge 1 ]]; then code=$((code+1)); fi
          [[ "$code" -gt 112 ]] || { echo 'Android versionCode must increase'; exit 1; }
          echo "LEVIMUSIC_ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "LEVIMUSIC_ANDROID_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "APK versionName=$VERSION versionCode=$code"
      - name: Set package manifest version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("manifest.json")
          obj = json.loads(path.read_text(encoding="utf-8"))
          obj["version"] = os.environ["VERSION"]
          path.write_text(json.dumps(obj, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          path2 = Path("manifest-standalone.json")
          standalone = json.loads(path2.read_text(encoding="utf-8"))
          standalone["version"] = os.environ["VERSION"]
          path2.write_text(json.dumps(standalone,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print("Packaging LeviMusic version", obj["version"])
          PY

      - name: Install Android tools
        uses: android-actions/setup-android@v4

      - name: Install NDK and build dependencies
        run: |
          sdkmanager --install "ndk;28.2.13676358" "platforms;android-28" "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake

      - name: Set up Java 17 for embedded standalone WebView
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify word-timed QRC conversion
        run: |
          mkdir -p build/qrc-test
          javac -encoding UTF-8 -d build/qrc-test \
            companion/app/src/main/java/com/reaaurelis/levimusic/bridge/WordTimedQrc.java \
            tests/QrcParserSmoke.java
          java -cp build/qrc-test com.reaaurelis.levimusic.bridge.QrcParserSmoke

      - name: Verify offline audio and LRC spacing
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/offline_audio_smoke.cpp -o /tmp/levimusic-offline-smoke
          /tmp/levimusic-offline-smoke
          mkdir -p build/offline-test
          javac -encoding UTF-8 -d build/offline-test companion/app/src/main/java/com/reaaurelis/levimusic/bridge/AudioFormat.java companion/app/src/main/java/com/reaaurelis/levimusic/bridge/LyricText.java tests/LyricTextSmoke.java
          java -cp build/offline-test com.reaaurelis.levimusic.bridge.LyricTextSmoke

      - name: Compile browser Java into self-contained DEX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/browser-classes build/browser-dex
          javac -encoding UTF-8 --release 8 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build/browser-classes \
            standalone_browser/src/com/reaaurelis/levimusic/standalone/NativeBrowser.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 28 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output build/browser-dex \
            $(find build/browser-classes -name '*.class' -type f)
          test -s build/browser-dex/classes.dex
      - name: Configure ARM64 Android
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile and package .levipack
        run: cmake --build build --target levipack levipack_standalone --parallel 2

      - name: Setup Java for Android companion
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore permanent Android release signing key
        id: signing
        env:
          KEY_B64: ${{ secrets.LEVIMUSIC_KEYSTORE_B64 }}
          PASSWORD: ${{ secrets.LEVIMUSIC_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEY_B64" || -z "$PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Permanent APK signing is not configured. Test APK only; release will be blocked."
            echo 'Run: bash scripts/setup_apk_signing_termux.sh (from authenticated Termux)' >> "$GITHUB_STEP_SUMMARY"
          else
            file="$RUNNER_TEMP/levimusic-release.jks"
            printf '%s' "$KEY_B64" | base64 --decode > "$file"
            chmod 600 "$file"
            keytool -list -keystore "$file" -storetype PKCS12 -storepass "$PASSWORD" -alias levimusic >/dev/null
            echo "LEVIMUSIC_KEYSTORE_FILE=$file" >> "$GITHUB_ENV"
            echo "LEVIMUSIC_SIGNING_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo 'Release keystore restored securely from GitHub Actions Secrets.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build Android companion APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.enabled }}" == 'true' ]]; then
            gradle -p companion :app:assembleRelease --no-daemon
          else
            gradle -p companion :app:assembleDebug --no-daemon
          fi

      - name: Prepare and verify companion APK
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.enabled }}" == 'true' ]]; then
            file="companion/app/build/outputs/apk/release/app-release.apk"
            output="build/LeviMusic-Bridge-${VERSION}.apk"
          else
            file="companion/app/build/outputs/apk/debug/app-debug.apk"
            output="build/LeviMusic-Bridge-UNSIGNED-TEST-${VERSION}.apk"
          fi
          cp "$file" "$output"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$output"
          ls -lh "$output"

      - name: Upload companion APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeviMusic-Bridge-Android
          path: build/LeviMusic-Bridge-*.apk
          if-no-files-found: error

      - name: Name and verify the installable package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_file="build/LeviMusic-${VERSION}-arm64-v8a.levipack"
          source_file="$release_file"
          if [[ ! -f "$source_file" ]]; then
            mapfile -t candidates < <(find build -maxdepth 1 -type f -name 'LeviMusic-*-arm64-v8a.levipack' ! -name 'LeviMusic-Standalone-*' -print)
            [[ "${#candidates[@]}" -eq 1 ]] || { printf 'Expected one Standard LeviPack, found %s\n' "${#candidates[@]}"; exit 1; }
            source_file="${candidates[0]}"
          fi
          if [[ "$source_file" != "$release_file" ]]; then
            mv "$source_file" "$release_file"
          fi
          unzip -t "$release_file"
          unzip -p "$release_file" manifest.json | python3 -c 'import json,os,sys; data=json.load(sys.stdin); assert data["version"]==os.environ["VERSION"], data'
          standalone_release="build/LeviMusic-Standalone-${VERSION}-arm64-v8a.levipack"
          standalone_src="$standalone_release"
          if [[ ! -f "$standalone_src" ]]; then
            mapfile -t candidates < <(find build -maxdepth 1 -type f -name 'LeviMusic-Standalone-*-arm64-v8a.levipack' -print)
            [[ "${#candidates[@]}" -eq 1 ]] || { printf 'Expected one Standalone LeviPack, found %s\n' "${#candidates[@]}"; exit 1; }
            standalone_src="${candidates[0]}"
          fi
          if [[ "$standalone_src" != "$standalone_release" ]]; then
            mv "$standalone_src" "$standalone_release"
          fi
          unzip -t "$standalone_release"
          unzip -p "$standalone_release" manifest.json | python3 -c 'import json,os,sys; data=json.load(sys.stdin); assert data["version"]==os.environ["VERSION"], data'
          echo "standalone=$standalone_release" >> "$GITHUB_OUTPUT"
          echo "file=$release_file" >> "$GITHUB_OUTPUT"

      - name: Upload artifact for every successful build
        uses: actions/upload-artifact@v4
        with:
          name: LeviMusic-${{ steps.version.outputs.version }}-arm64-v8a
          path: |
            ${{ steps.package.outputs.file }}
            ${{ steps.package.outputs.standalone }}
          if-no-files-found: error

      - name: Require permanent APK signing before publishing
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.enabled != 'true'
        run: |
          echo '::error::Release blocked. Configure permanent APK signing with scripts/setup_apk_signing_termux.sh in Termux.'
          exit 1
      - name: Check whether the GitHub Release exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare version notes
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.enabled == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          channel = os.environ["CHANNEL"]
          previous = os.environ.get("PREVIOUS_TAG", "")
          label = "beta" if channel == "beta" else "stable"
          if version == "1.6.9":
              notes = Path("release-notes/v1.6.9.md").read_text(encoding="utf-8")
          elif version == "1.6.8":
              notes = Path("release-notes/v1.6.8.md").read_text(encoding="utf-8")
          elif version == "1.6.7":
              notes = Path("release-notes/v1.6.7.md").read_text(encoding="utf-8")
          elif version == "1.6.6":
              notes = "\n".join([
                  "# LeviMusic - Aurelis Online v1.6.6 stable",
                  "",
                  "Client-side music for Minecraft Bedrock through LeviLauncher Android ARM64.",
                  "",
                  "## Environmental audio improvements",
                  "- Standard and Standalone now use a tunable environmental reverb path instead of relying on equalizer changes alone.",
                  "- Expanded room and cave detection to cover wider enclosed spaces.",
                  "- Underwater playback preserves bass while applying stronger high-frequency damping.",
                  "",
                  "Standard mode requires the matching v1.6.6 Bridge APK.",
                  "",
              ])
          elif version == "1.6.5":
              notes = "\n".join([
                  "# LeviMusic - Aurelis Online v1.6.5 stable",
                  "",
                  "Client-side music for Minecraft Bedrock through LeviLauncher Android ARM64.",
                  "",
                  "## Standard hotfix since v1.6.4",
                  "- Fixed native stability on Minecraft 1.26.66.1 by correcting an invalid matrix-stack receiver and adding fail-closed matrix validation.",
                  "- Replaced the broken private Block-name probe with exact-build water and enclosure queries, so environmental audio now detects underwater and cave/interior conditions.",
                  "- Fixed Standard Bridge effects not updating when the environment changed within the same audio session, and made cave reverb and underwater filtering clearly audible.",
                  "",
                  "Standard mode requires the matching v1.6.5 Bridge APK.",
                  "",
              ])
          elif version == "1.6.4":
              notes = "\n".join([
                  "# LeviMusic - Aurelis Online v1.6.4 stable",
                  "",
                  "Client-side music for Minecraft Bedrock through LeviLauncher Android ARM64. The 3D world renderer includes exact profiles for Minecraft 1.26.52, 1.26.60, 1.26.62.1, and 1.26.66.1.",
                  "",
                  "## Changes since v1.6.3",
                  "- Added Repeat and playlist-only Shuffle controls to Now Playing in Full and Standalone modes.",
                  "- Song URLs and public playlist URLs can now be entered directly in the mod. Imported public-playlist tracks can be added to a saved playlist.",
                  "- Added cover art and artist names to Search, Up Next, and playlist track rows.",
                  "- Fixed the music HUD remaining visible or touchable after LeviMusic is disabled from LeviLauncher Mod Menu.",
                  "- Saved playlists now wrap from their final track back to the first track.",
                  "- Added a configurable Keybinds tab for opening the player, Previous, Next, and Play/Pause.",
                  "",
                  "Choose one LeviPack variant. Full mode requires the matching Bridge APK; Standalone uses Aurelis for online playback and downloads.",
                  "",
              ])
          elif version == "1.6.3":
              notes = "\n".join([
                  "# LeviMusic - Aurelis Online v1.6.3 stable",
                  "",
                  "Client-side music for Minecraft Bedrock through LeviLauncher Android ARM64. The 3D world renderer includes exact profiles for Minecraft 1.26.52, 1.26.60, 1.26.62.1, and 1.26.66.1.",
                  "",
                  "## Standard / Bridge fix since v1.6.2",
                  "- Fixed the automatic Offline playlist not appearing in the Minecraft mod after audio was downloaded or imported through the Bridge app.",
                  "- The Bridge now reconciles its Offline playlist with audio files actually stored on the device before serving playlist and track data to Minecraft.",
                  "- The in-game Standard mod always exposes the automatic Offline library and avoids duplicate Offline entries.",
                  "",
                  "This hotfix affects Standard mode with the Bridge APK. Standalone behavior is unchanged.",
                  "",
              ])
          elif version == "1.6.2":
              notes = "\n".join([
                  "# LeviMusic - Aurelis Online v1.6.2 stable",
                  "",
                  "Client-side music for Minecraft Bedrock through LeviLauncher Android ARM64. The 3D world renderer includes exact profiles for Minecraft 1.26.52, 1.26.60, 1.26.62.1, and 1.26.66.1.",
                  "",
                  "## Fixes and changes since v1.6.1",
                  "- Offline lyrics no longer show a Font unavailable placeholder in 3D. If a non-Latin line cannot be rasterized and has no usable romanization, only its 3D rendering is skipped; HUD lyrics remain available.",
                  "- Saved playlists now play strictly in their stored order, show the matching Up Next sequence, and loop to the first track after the final track in Full and Standalone modes.",
                  "- Added a dedicated Experimental settings tab for 3D Lyrics Beats.",
                  "- Added an independent HUD lyrics toggle and four placement choices: Up Left, Up Right, Down Left, and Down Right.",
                  "- Fixed stuck player movement when the music menu is opened while a movement pointer is already active.",
                  "",
                  "Choose one LeviPack variant. Full mode requires the matching Bridge APK; Standalone uses Aurelis for online playback and downloads.",
                  "",
              ])
          elif version == "1.6.1":
              notes = "\n".join([
                  "# LeviMusic - Aurelis Online v1.6.1 stable",
                  "",
                  "Client-side music for Minecraft Bedrock through LeviLauncher Android ARM64. The 3D world renderer includes exact profiles for Minecraft 1.26.52, 1.26.60, 1.26.62.1, and 1.26.66.1.",
                  "",
                  "## Fixes since v1.6.0",
                  "- Fixed the in-game Offline download path for Aurelis IDs of varying lengths and audio served as application/octet-stream. The mod now validates actual audio signatures, and Standalone no longer blocks downloads on a separate playback probe.",
                  "- Bridge offline downloads retry through the Aurelis stream endpoint if the primary audio source fails.",
                  "- Restored missing Latin word spaces in local and enhanced LRC lyrics, including lines such as You Miss Everything, while preserving CJK text.",
                  "",
                  "Choose one LeviPack variant. Full mode requires the matching Bridge APK; Standalone uses Aurelis for online playback and downloads. Audio availability still depends on the source service.",
                  "",
              ])
          elif version == "1.6.0":
              notes = "\n".join([
                  "# LeviMusic - Aurelis Online v1.6.0 stable",
                  "",
                  "Client-side music for Minecraft Bedrock through LeviLauncher Android ARM64. The 3D world renderer includes exact profiles for Minecraft 1.26.52, 1.26.60, 1.26.62.1, and 1.26.66.1.",
                  "",
                  "## Changes since v1.5.1",
                  "- Import public YouTube / YouTube Music playlists. Bridge tries NewPipe first and falls back to the Aurelis playlist API; Standalone tries Aurelis first and the public YouTube page as fallback. Lists are saved locally.",
                  "- Full mode: Save to Offline in Bridge or DL in-game downloads a searched song and available LRC. Bridge can also import local audio and same-name LRC files using Android's file picker.",
                  "- Standalone: DL in-game saves searched audio and available synced lyrics. Manually added audio with a matching .lrc in the mod configuration directory's music folder remains supported. Saved tracks appear in Offline.",
                  "- Rename and delete playlists in game; the Bridge app also offers playlist management.",
                  "",
                  "Choose one LeviPack variant. Full mode requires the matching Bridge APK; Standalone uses Aurelis for online playback.",
                  "",
              ])
          elif version == "1.5.1":
              notes = "\n".join([
                  "# LeviMusic - Aurelis Online v1.5.1 stable",
                  "",
                  "Client-side music for Minecraft Bedrock through LeviLauncher Android ARM64.",
                  "",
                  "## Minecraft compatibility",
                  "3D world lyrics have exact ARM64 profiles for Minecraft 1.26.52, 1.26.60, 1.26.62.1, and 1.26.66.1. The 1.26.66.1 profile was checked against the supplied binary, but its behavior has not yet been verified on a device and may be less stable.",
                  "",
                  "## Changes since v1.5.0",
                  "- Added a Build ID locked 3D renderer profile for Minecraft 1.26.66.1 with seven unique native instruction signatures.",
                  "- Renderer binding still refuses unknown binaries or mismatched signatures without blocking the music player.",
                  "",
                  "Choose one LeviPack variant: Full mode requires the matching Bridge APK; Standalone requires internet access to the hosted Aurelis Symphony service.",
                  "",
              ])
          else:
              notes = "\n".join([
                  f"# LeviMusic - Aurelis Online v{version} {label}",
                  "",
                  "A client-side music player for Minecraft Bedrock on LeviLauncher Android ARM64. World-space 3D lyrics are visible only to the local player.",
                  "",
                  "## Minecraft compatibility",
                  "- 3D world lyrics are supported on matching ARM64 Build IDs for Minecraft 1.26.52, 1.26.60, and 1.26.62.1. Core music may run on 1.26.66.1 if the loader accepts the mod; 3D rendering remains unverified there.",
                  "",
                  "## Changes",
                  f"[Review changes since {previous}](https://github.com/TerserahGw/levimusic-android/compare/{previous}...v{version})" if previous else "See the repository history for changes in this release.",
                  "",
                  "Choose one LeviPack variant. Full mode needs the matching Bridge APK; Standalone uses the hosted Aurelis Symphony service and requires internet access.",
                  "",
              ])
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          print(notes)
          PY

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PACKAGE: ${{ steps.package.outputs.file }}
          STANDALONE: ${{ steps.package.outputs.standalone }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          APK: build/LeviMusic-Bridge-${{ steps.version.outputs.version }}.apk
        shell: bash
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$CHANNEL" == beta ]]; then release_flags+=(--prerelease); fi
          if [[ "${{ steps.release_check.outputs.exists }}" == true ]]; then
            gh release upload "$TAG" "$PACKAGE" "$STANDALONE" "$APK" --clobber
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file release-notes.md
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            echo "Replaced release $TAG assets and updated its source tag."
            if [[ "$TAG" == v1.6.0 ]]; then
              accidental="$(gh release view v1.6.1 --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
              if [[ "$accidental" == ffb404879bb5196e4900d23fc2758efcd34941cc ]]; then
                gh release delete v1.6.1 --yes --cleanup-tag
                echo "Removed the accidental v1.6.1 release from this revision."
              fi
            fi
          else
            gh release create "$TAG" "$PACKAGE" "$STANDALONE" "$APK" \
              --target "$GITHUB_SHA" \
              "${release_flags[@]}" \
              --title "LeviMusic - Aurelis Online v$VERSION" \
              --notes-file release-notes.md
            echo "Published release $TAG with $PACKAGE."
          fi


