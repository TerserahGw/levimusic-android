plugins { id 'com.android.application' }

android {
    namespace 'com.reaaurelis.levimusic.bridge'
    compileSdk 35
    defaultConfig {
        applicationId 'com.reaaurelis.levimusic.bridge'
        minSdk 28
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('LEVIMUSIC_ANDROID_VERSION_CODE') ?: '10401')
        versionName (System.getenv('LEVIMUSIC_ANDROID_VERSION_NAME') ?: '1.4.1')
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            pickFirsts += ['META-INF/CONTRIBUTORS.md', 'META-INF/LICENSE.md', 'META-INF/NOTICE.md']
        }
    }
    // The same private GitHub Actions signing key must be reused for every APK.
    signingConfigs {
        release {
            if (System.getenv('LEVIMUSIC_KEYSTORE_FILE')) {
                storeFile file(System.getenv('LEVIMUSIC_KEYSTORE_FILE'))
                storeType 'PKCS12'
                storePassword System.getenv('LEVIMUSIC_SIGNING_PASSWORD')
                keyAlias 'levimusic'
                keyPassword System.getenv('LEVIMUSIC_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('LEVIMUSIC_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}
dependencies {
    def mediaVersion = '1.3.0'
    implementation "androidx.media3:media3-common:$mediaVersion"
    implementation "androidx.media3:media3-exoplayer:$mediaVersion"
    implementation "androidx.media3:media3-session:$mediaVersion"
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'
}


