plugins { id 'com.android.application' }

android {
    namespace 'com.reaaurelis.levimusic.bridge'
    compileSdk 35
    defaultConfig {
        applicationId 'com.reaaurelis.levimusic.bridge'
        minSdk 28
        targetSdk 34
        versionCode 112
        versionName '1.1.2-rc1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    def mediaVersion = '1.3.1'
    implementation "androidx.media3:media3-common:$mediaVersion"
    implementation "androidx.media3:media3-exoplayer:$mediaVersion"
    implementation "androidx.media3:media3-session:$mediaVersion"
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
